services:
  db:
    image: mariadb:10.3.32
    container_name: mariadb
    restart: always
    environment:
      MYSQL_DATABASE: growandcheer
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ../db/growandcheer.sql:/docker-entrypoint-initdb.d/growandcheer.sql
    ports:
      - "3307:3306"

  backend:
    build:
      context: ../backend
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
