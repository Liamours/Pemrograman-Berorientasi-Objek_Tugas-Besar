services:
  db:
    image: mariadb:10.3.32
    container_name: mariadb
    restart: always
    environment:
      MYSQL_DATABASE: growandcheer
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ../db/growandcheer.sql:/docker-entrypoint-initdb.d/growandcheer.sql
      - db_data:/var/lib/mysql
    ports:
      - "3308:3306"

  backend:
    build:
      context: ../backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    command: ["java", "-jar", "target/rest-service-0.0.1-SNAPSHOT.jar"]

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: ["serve", "-s", "build", "-l", "3000"]

volumes:
  db_data:
